name: A workflow for our group project
on: push

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Maven
        run: mvn package
      - name: Run docker compose
        run: |
          docker compose up  -d db
          printf "yes\n1o\nno\nyes\nEurope\nno\nno\nyes\nWestern Europe\nyes\n5\nno\n" | docker compose run --rm -T app
          docker compose down

